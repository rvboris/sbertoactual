name: Reusable Test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout for validation
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate dispatched commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        with:
          script: |
            const expected = context.payload.inputs?.expected_sha;
            const releaseRef = 'refs/heads/release-please--branches--master--components--sbertoactual';
            if (context.ref === releaseRef && !expected) {
              throw new Error('Release branch dispatch requires expected_sha');
            }
            if (expected && (!/^[0-9a-f]{40}$/.test(expected) || expected !== context.sha)) {
              throw new Error('Dispatched expected_sha must be a lowercase 40-hex SHA matching context.sha');
            }

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Test with Coverage
        run: pnpm run coverage

      - name: Report Coverage
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Vitest Coverage
