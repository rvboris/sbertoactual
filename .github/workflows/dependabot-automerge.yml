name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && !contains(github.event.pull_request.head.ref, 'github-actions')
    runs-on: ubuntu-latest
    steps:
      - name: Retitle as fix so release-please cuts a release
        if: contains(github.event.pull_request.head.ref, 'actual-app-api')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --title "$(gh pr view "$PR_URL" --json title --jq .title | sed 's/^chore(deps)/fix/')"
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
