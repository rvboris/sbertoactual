name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dispatch-release-pr-checks:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Dispatch checks for the release PR
        uses: actions/github-script@v8
        with:
          script: |
            const branch = 'release-please--branches--master--components--sbertoactual';
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'master', per_page: 100,
            });
            const candidates = prs.filter(pr => pr.head.ref === branch);
            if (candidates.length === 0) {
              core.info('No open release PR; no checks to dispatch.');
              return;
            }
            if (candidates.length !== 1) {
              throw new Error('Ambiguous release PR identity');
            }
            const validateIdentity = pr => {
              const sameRepo = side => side?.repo?.owner?.login === owner && side.repo.name === repo;
              if (pr.state !== 'open' || pr.head.ref !== branch || pr.base.ref !== 'master' ||
                  !sameRepo(pr.head) || !sameRepo(pr.base) || pr.user?.login !== 'github-actions[bot]') {
                throw new Error('Invalid release PR identity');
              }
            };
            validateIdentity(candidates[0]);
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: candidates[0].number,
            });
            validateIdentity(pr);
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            if (!/^[0-9a-f]{40}$/.test(pr.head.sha) || ref.object.sha !== pr.head.sha) {
              throw new Error('Release PR and branch SHA do not match');
            }
            core.info(`Dispatching checks for PR #${pr.number}, ref ${branch}, SHA ${pr.head.sha}`);
            for (const workflow_id of ['test.yml', 'docker-publish.yml']) {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id, ref: branch, inputs: { expected_sha: pr.head.sha },
              });
            }

  test-release-artifact:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
    permissions:
      contents: read
      pull-requests: write

  publish-npm:
    needs:
      - release-please
      - test-release-artifact
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: pnpm publish --no-git-checks --provenance --access public
