name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  approve-release-pr-checks:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Approve checks for the release PR
        uses: actions/github-script@v8
        with:
          script: |
            const branch = 'release-please--branches--master--components--sbertoactual';
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'master', per_page: 100,
            });
            const candidates = prs.filter(pr => pr.head.ref === branch);
            if (candidates.length === 0) {
              core.info('No open release PR; no checks to approve.');
              return;
            }
            if (candidates.length !== 1) {
              throw new Error('Ambiguous release PR identity');
            }
            const validateIdentity = pr => {
              const sameRepo = side => side?.repo?.owner?.login === owner && side.repo.name === repo;
              if (pr.state !== 'open' || pr.head.ref !== branch || pr.base.ref !== 'master' ||
                  !sameRepo(pr.head) || !sameRepo(pr.base) || pr.user?.login !== 'github-actions[bot]') {
                throw new Error('Invalid release PR identity');
              }
            };
            validateIdentity(candidates[0]);
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: candidates[0].number,
            });
            validateIdentity(pr);
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            if (!/^[0-9a-f]{40}$/.test(pr.head.sha) || ref.object.sha !== pr.head.sha) {
              throw new Error('Release PR and branch SHA do not match');
            }
            const expectedSha = pr.head.sha;
            core.info(`Checking PR #${pr.number}, ref ${branch}, SHA ${expectedSha}`);
            for (const filename of ['test.yml', 'docker-publish.yml']) {
              const { data: workflow } = await github.rest.actions.getWorkflow({
                owner, repo, workflow_id: filename,
              });
              let latest;
              for (let attempt = 0; attempt < 12; attempt++) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: workflow.id,
                  event: 'pull_request', head_sha: expectedSha, per_page: 100,
                });
                latest = data.workflow_runs.reduce((newest, run) =>
                  !newest || run.id > newest.id ? run : newest, undefined);
                if (latest) break;
                if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
              }
              if (!latest) {
                throw new Error(`No pull_request run for ${filename} at ${expectedSha} after 12 attempts`);
              }
              const { data: currentPr } = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number,
              });
              validateIdentity(currentPr);
              const { data: currentRef } = await github.rest.git.getRef({
                owner, repo, ref: `heads/${branch}`,
              });
              if (currentPr.head.sha !== expectedSha || currentRef.object.sha !== expectedSha) {
                throw new Error('Release PR or branch changed before approval');
              }
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: latest.id,
              });
              if (run.workflow_id !== workflow.id || run.event !== 'pull_request' ||
                  run.head_sha !== expectedSha || run.head_branch !== branch ||
                  run.head_repository?.full_name !== `${owner}/${repo}` ||
                  run.actor?.login !== 'github-actions[bot]') {
                throw new Error(`Invalid workflow run identity for ${filename}, run ${run.id}`);
              }
              if (!run.pull_requests?.some(associated => associated.number === pr.number)) {
                throw new Error(`Run ${run.id} is missing association with release PR #${pr.number}`);
              }
              if (run.conclusion === 'action_required') {
                await github.rest.actions.approveWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Approved ${filename} run ${run.id} for PR #${pr.number} at ${expectedSha}`);
              } else if ((run.conclusion == null && ['queued', 'in_progress'].includes(run.status)) ||
                         run.conclusion === 'success') {
                core.info(`${filename} run ${run.id}: ${run.conclusion ?? run.status}`);
              } else {
                throw new Error(`${filename} run ${run.id} cannot be approved: ${run.conclusion ?? run.status}`);
              }
            }

  test-release-artifact:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/reusable-test.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
    permissions:
      contents: read
      pull-requests: write

  publish-npm:
    needs:
      - release-please
      - test-release-artifact
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: pnpm publish --no-git-checks --provenance --access public
